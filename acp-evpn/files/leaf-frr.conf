frr defaults datacenter
!
interface lo
 ip address 10.100.100.2/32
!
vrf vrf100
 vni 1000
exit-vrf
!
vrf vrf300
 vni 3000
exit-vrf
!
vrf vrf104030
 vni 104030
exit-vrf
!
router bgp 4200000011
 bgp router-id 10.100.100.2
 neighbor FIREWALL peer-group
 neighbor FIREWALL remote-as external
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor REMOTE peer-group
 neighbor REMOTE remote-as external
 neighbor REMOTE ebgp-multihop 2
 neighbor Ethernet1 interface peer-group FIREWALL
 neighbor Ethernet46 interface peer-group FABRIC
 neighbor 10.100.100.1 peer-group REMOTE
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor FIREWALL activate
  neighbor FIREWALL allowas-in 1
  neighbor REMOTE activate
  advertise-all-vni
 exit-address-family
!
router bgp 4200000011 vrf vrf300
 bgp router-id 10.100.100.2
 neighbor K3S peer-group
 neighbor K3S remote-as external
 neighbor Ethernet0 interface peer-group K3S
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
router bgp 4200000011 vrf vrf100
 bgp router-id 10.100.100.2
 neighbor SHOOT peer-group
 neighbor SHOOT remote-as external
 neighbor Ethernet2 interface peer-group SHOOT
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
