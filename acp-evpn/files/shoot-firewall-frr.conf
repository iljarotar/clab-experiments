frr defaults datacenter
!
interface lo
 ip address 10.100.254.1/32
!
vrf vrf100
 vni 1000
exit-vrf
!
vrf vrf300
 vni 3000
exit-vrf
!
router bgp 4200000201
 bgp router-id 10.100.254.1
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor eth0 interface peer-group FABRIC
 neighbor eth1 interface peer-group FABRIC
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor FABRIC activate
  advertise-all-vni
 exit-address-family
!
router bgp 4200000201 vrf vrf100
 bgp router-id 10.100.254.1
 !
 address-family ipv4 unicast
  redistribute connected
  import vrf vrf300
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
router bgp 4200000201 vrf vrf300
 bgp router-id 10.100.254.1
 !
 address-family ipv4 unicast
  redistribute connected
  import vrf vrf100
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
